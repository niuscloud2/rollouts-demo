apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base
- canary-rollout.yaml

patches:
- target:
    group: argoproj.io
    version: v1alpha1
    kind: Rollout
    name: canary-demo
  patch: |-
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        workload-type: demo-amd64
